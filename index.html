        /* ===================== FICHIERS & MESSAGES PRIVÉS ===================== */
        const FILE_EXTS = ["pdf", "doc", "docx", "odt", "ods", "odp", "txt", "rtf", "csv", "xls", "xlsx", "ppt", "pptx", "md"];
        const PREVIEW = { pdf: "application/pdf", txt: "text/plain;charset=utf-8", md: "text/plain;charset=utf-8", csv: "text/plain;charset=utf-8" };
        const FILE_ICON = { pdf: "📕", doc: "📘", docx: "📘", odt: "📘", txt: "📄", md: "📄", rtf: "📄", csv: "📊", xls: "📗", xlsx: "📗", ods: "📗", ppt: "📙", pptx: "📙", odp: "📙" };
        const tagsOf = (id, p) => [presence[id] ? "🟢" : "", p.role === "admin" ? "👑" : p.role === "mod" ? "🛡️" : "", p.muted ? "🔇" : "", p.banned ? "🚫" : ""].join(" ");

        async function uploadFile(f) {
            const ext = (f.name.split(".").pop() || "").toLowerCase();
            if (!FILE_EXTS.includes(ext)) throw new Error("Type de fichier non autorisé (pdf, docx, odt, txt, xlsx, pptx…).");
            if (f.size > 600000) throw new Error("Fichier trop lourd (600 Ko maximum).");
            const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("Lecture impossible.")); r.readAsDataURL(f); });
            const ref = push(R("files"));
            await set(ref, { name: f.name.slice(0, 80), ext, data, by: currentId, createdAt: Date.now() });
            return { id: ref.key, name: f.name.slice(0, 80), ext, size: f.size };
        }
        async function pickAtt() {
            const f = $("im-file").files[0];
            if (f && !f.type.startsWith("image/")) return { file: await uploadFile(f) };
            return { image: await pickImage() };
        }
        function fileCard(f, dark) {
            const a = `data-fid="${esc(f.id)}" data-ext="${esc(f.ext)}" data-name="${esc(f.name)}"`;
            return `<div class="flex items-center gap-3 mt-1 p-2.5 rounded-xl text-left ${dark ? "bg-blue-700/60" : "bg-slate-100 text-slate-800"}"><span class="text-2xl">${FILE_ICON[f.ext] || "📄"}</span>
                <div class="min-w-0 flex-1"><p class="text-sm font-semibold truncate">${esc(f.name)}</p><p class="text-[11px] opacity-70">${esc(String(f.ext).toUpperCase())} · ${Math.max(1, Math.round((f.size || 0) / 1024))} Ko</p></div>
                ${PREVIEW[f.ext] ? `<button data-act="fopen" ${a} title="Ouvrir" class="text-sm px-2 py-1 rounded-lg bg-white/80 text-slate-700 hover:bg-white">👁️</button>` : ""}
                <button data-act="fdl" ${a} title="Télécharger" class="text-sm px-2 py-1 rounded-lg bg-white/80 text-slate-700 hover:bg-white">⬇️</button></div>`;
        }
        async function fetchFile(fid, ext, name, open) {
            const w = open ? window.open("about:blank", "_blank") : null;
            try {
                const v = (await get(R("files/" + fid))).val();
                if (!v) { if (w) w.close(); return toast("Fichier introuvable (supprimé ?)."); }
                const bin = atob(v.data), arr = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                const url = URL.createObjectURL(new Blob([arr], { type: open ? PREVIEW[ext] : "application/octet-stream" }));
                if (open && w) w.location.href = url;
                else { const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
                setTimeout(() => URL.revokeObjectURL(url), 120000);
            } catch (e) { if (w) w.close(); toast("Erreur : " + e.message); }
        }

        /* --- Messages privés (boîte de réception) --- */
        function listenInbox() {
            onValue(R("inbox/" + currentId), (snap) => {
                const prev = new Set(Object.keys(inbox));
                inbox = snap.val() || {};
                const n = Object.values(inbox).filter(m => !m.read).length;
                $("inbox-count").innerText = n; $("inbox-count").classList.toggle("hidden", !n);
                if (!inboxFirst && Object.entries(inbox).some(([k, m]) => !prev.has(k) && !m.read)) { playSound(); toast("✉️ Nouveau message privé !"); }
                inboxFirst = false;
                if (modalKind === "inbox") { renderInbox(); markRead(); }
            });
        }
        function markRead() {
            Object.entries(inbox).filter(([, m]) => !m.read).forEach(([k]) => update(R(`inbox/${currentId}/${k}`), { read: true }).catch(() => {}));
        }
        window.openInbox = () => { renderInbox(true); markRead(); };
        function renderInbox(open) {
            const list = Object.entries(inbox).map(([k, v]) => ({ ...v, key: k })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            const html = modalHead("📥 Boîte de réception") + (list.length ? list.map(m => {
                const quote = m.replyTo ? `<div class="text-xs mb-1.5 px-2 py-1 rounded-lg border-l-4 bg-slate-100 border-slate-400"><b>${esc(m.replyTo.user || "")}</b><span class="block truncate opacity-80">${esc(m.replyTo.text || "")}</span></div>` : "";
                return `<div class="border ${m.read ? "border-slate-200" : "border-blue-400 bg-blue-50"} rounded-2xl p-3 mb-2">
                    <div class="flex items-center gap-2 text-sm"><b>${esc((profiles[m.from] || {}).pseudo || m.fromName || m.from)}</b><span class="text-xs text-slate-400">${new Date(m.createdAt || 0).toLocaleString("fr-FR")}</span></div>
                    ${quote}
                    ${m.text ? `<p class="text-sm text-slate-700 mt-1 whitespace-pre-wrap break-words">${formatText(m.text)}</p>` : ""}
                    ${safeImg(m.image) ? `<img src="${esc(m.image)}" data-act="zoom" class="rounded-xl max-h-48 mt-2 cursor-zoom-in" alt="Image">` : ""}${m.file ? fileCard(m.file, false) : ""}
                    <div class="mt-2 flex gap-2"><button data-m="dmReply" data-id="${esc(m.from)}" data-key="${m.key}" class="px-3 py-1 rounded-lg text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700">↩️ Répondre</button>
                    <button data-m="inboxDel" data-key="${m.key}" class="px-2 py-1 rounded-lg text-xs bg-slate-100 hover:bg-red-100">🗑️</button></div></div>`;
            }).join("") : '<p class="text-center text-slate-400 py-8">Aucun message privé pour l\'instant.</p>');
            if (open) openModal("inbox", html); else if (modalKind === "inbox") $("modal-body").innerHTML = html;
        }

        window.openDm = (to, quoteObj) => {
            const p = profiles[to];
            if (!p) return toast("Destinataire introuvable.");
            if (me && me.muted && !isAdmin) return toast("🔇 Tu es muet.");
            window._activeDmReply = quoteObj || null;
            const quoteDisplay = quoteObj ? `<div class="text-xs mb-2 px-3 py-1.5 bg-slate-100 border-l-4 border-blue-500 rounded-lg"><b>↩️ Réponse à ${esc(quoteObj.user)} :</b> <span class="truncate">${esc(quoteObj.text)}</span></div>` : "";
            openModal("dm", `${modalHead("✉️ Message privé")}
                <p class="text-sm text-slate-600">À : <b>${esc(p.avatar || "")} ${esc(p.pseudo)}</b></p>
                ${quoteDisplay}
                <textarea id="dm-t" rows="4" maxlength="500" class="${INP} mt-2" placeholder="Ton message…"></textarea>
                <label class="${LBL}">Image ou document (facultatif)</label>
                <input type="file" id="im-file" accept="image/*,.pdf,.doc,.docx,.odt,.ods,.odp,.txt,.rtf,.csv,.xls,.xlsx,.ppt,.pptx,.md" class="${INP}"><input id="im-url" placeholder="… ou lien d'image https://" class="${INP} mt-2">
                <input type="hidden" id="dm-to" value="${esc(to)}"><div class="mt-4"><button data-m="dmSend" class="${BTN}">Envoyer</button></div>`);
        };

        /* --- Infos du site / du salon --- */
        const memRow = (id) => { const p = profiles[id]; return p ? `<button data-m="viewProf" data-id="${esc(id)}" class="flex items-center gap-2 w-full text-left py-1.5 border-b border-slate-100 text-sm"><span>${presence[id] ? "🟢" : "⚪"}</span><span class="text-lg">${esc(p.avatar || "🙂")}</span><b>${esc(p.pseudo || id)}</b><span class="text-xs">${badge(p)}</span></button>` : ""; };
        const roomRules = (r) => `✍️ ${r.writers === "admin" ? "admins seulement" : r.writers === "mods" ? "modos + admins" : "tout le monde"}${r.slow ? ` · ⏳ ${r.slow} s entre 2 messages` : ""} · ${r.maxLen || 500} caractères max${r.polls === false ? " · sans sondages" : ""}${r.images === false ? " · sans images/fichiers" : ""}`;
        
        window.openSiteInfo = () => {
            const ids = Object.keys(profiles).sort((a, b) => (profiles[a].pseudo || "").localeCompare(profiles[b].pseudo || ""));
            const rms = Object.entries(allRooms()).filter(([, r]) => canSee(r)).map(([id, r]) => `<div class="py-1.5 border-b border-slate-100 text-sm"><b>${r.private ? "🔒" : "#"} ${esc(r.name || id)}</b><div class="text-xs text-slate-500">${esc(roomRules(r))}</div></div>`).join("");
            openModal("info", `${modalHead("ℹ️ Chat de Classe")}
                <p class="text-sm text-slate-600">Le chat en temps réel de la classe : salons, sondages, images et fichiers, espace devoirs et messages privés (📥 boîte de réception).</p>
                <h4 class="${LBL}">💬 Salons</h4>${rms}
                <h4 class="${LBL}">👥 Membres (${ids.length})</h4>${ids.map(memRow).join("")}`);
        };

        window.openRoomInfo = () => {
            if (currentChannel === "__hw") return openModal("info", `${modalHead("📚 Espace devoirs")}<p class="text-sm text-slate-600">Espace partagé et non supprimable, organisé en rubriques : aide, cours, révisions, autres.</p>`);
            const r = roomCfg();
            const ids = r.private
                ? [...new Set((r.members || "").split(",").filter(Boolean).concat(Object.keys(profiles).filter(i => profiles[i].role === "admin")))]
                : [...new Set(lastMessages.map(m => m.userId).filter(Boolean))];
            openModal("info", `${modalHead((r.private ? "🔒 " : "# ") + esc(roomName(currentChannel)))}
                <p class="text-xs text-slate-500">${esc(roomRules(r))}</p>
                <h4 class="${LBL}">${r.private ? "Membres admis" : "Ont écrit récemment ici"} (${ids.filter(i => profiles[i]).length})</h4>${ids.map(memRow).join("") || '<p class="text-sm text-slate-400">Personne pour l\'instant.</p>'}
                ${isAdmin ? `<div class="mt-4"><button data-m="roomEdit" data-id="${esc(currentChannel)}" class="${BTN}">⚙️ Paramètres du salon</button></div>` : ""}`);
        };

        function manageView(id) {
            const p = profiles[id];
            const btn = (m, label, cls = "bg-slate-100 hover:bg-slate-200 text-slate-700") => `<button data-m="${m}" data-id="${esc(id)}" class="px-3 py-2 rounded-xl text-sm font-semibold ${cls}">${label}</button>`;
            let a = btn("adminMute", p.muted ? "🔊 Démuter" : "🔇 Rendre muet");
            if (isAdmin) a += btn("adminRename", "✏️ Renommer") + btn("adminMod", p.role === "mod" ? "⬇️ Retirer modo" : "🛡️ Nommer modo") + btn("adminResetPw", "🔑 Mot de passe")
                + btn("adminBan", p.banned ? "✅ Débannir" : "🚫 Bannir", "bg-red-100 hover:bg-red-200 text-red-700") + btn("adminDel", "🗑️ Supprimer le compte", "bg-red-100 hover:bg-red-200 text-red-700");
            return `${modalHead("⚙️ " + esc(p.pseudo || id))}<button data-m="adminBack" class="text-sm text-blue-600 font-semibold mb-3">← Retour au panneau</button>
                <div class="flex items-center gap-2 mb-4"><span class="text-3xl">${esc(p.avatar || "🙂")}</span><div><b>${esc(p.pseudo || id)}</b><div class="text-xs text-slate-400">@${esc(id)} · ${tagsOf(id, p)}</div></div></div><div class="flex flex-wrap gap-2">${a}</div>`;
        }

        /* ===================== FENÊTRES ===================== */
        function openModal(kind, html) {
            modalKind = kind;
            $("modal-body").innerHTML = html;
            $("modal").classList.remove("hidden");
        }
        window.closeModal = () => { $("modal").classList.add("hidden"); modalKind = null; };
        function refreshModal() {
            if (modalKind === "admin" && !(document.activeElement && document.activeElement.id === "ad-ann")) renderAdminPanel();
        }
        const modalHead = (title) => `<div class="flex justify-between items-center mb-4"><h3 class="text-xl font-black text-slate-900">${title}</h3><button data-m="close" class="text-slate-400 hover:text-slate-700 text-xl">✕</button></div>`;

        window.openHelp = () => {
            const rows = [["/roll [n]", "Lance un dé"], ["/flip", "Pile ou face"], ["/8ball question", "Boule magique"], ["/me action", "Message d'action"]];
            const line = ([a, b]) => `<div class="flex justify-between gap-4 py-1.5 border-b border-slate-100 text-sm"><code class="text-blue-700 font-semibold">${esc(a)}</code><span class="text-slate-500 text-right">${esc(b)}</span></div>`;
            openModal("help", modalHead("❓ Commandes") + rows.map(line).join(""));
        };

        window.openProfileEditor = () => {
            if (!me) return;
            draft = { avatar: me.avatar || "🙂", color: me.color || COLORS[0] };
            openModal("profile", `${modalHead("👤 Mon profil")}
                <label class="${LBL}">Pseudo</label><input id="pf-pseudo" value="${esc(me.pseudo)}" maxlength="20" class="${INP}">
                <label class="${LBL}">Bio</label><input id="pf-bio" value="${esc(me.bio || "")}" maxlength="80" class="${INP}">
                <label class="${LBL}">Avatar</label><div class="flex flex-wrap gap-2">${AVATARS.map(a => `<button data-m="avatar" data-v="${a}" class="w-10 h-10 text-xl rounded-xl bg-slate-100 hover:bg-slate-200 ${a === draft.avatar ? "ring-2 ring-blue-600" : ""}">${a}</button>`).join("")}</div>
                <div class="mt-5"><button data-m="saveProfile" class="${BTN}">Enregistrer</button></div>`);
        };

        function viewProfile(id) {
            const p = profiles[id];
            if (!p) return;
            openModal("view", `${modalHead("Profil")}
                <div class="text-center">
                    <div class="text-6xl mb-2">${esc(p.avatar || "🙂")}</div>
                    <div class="text-xl font-black" style="color:${esc(p.color || "#475569")}">${esc(p.pseudo)}${badge(p)}</div>
                    <p class="text-sm text-slate-600 mt-2">${esc(p.bio || "Pas de bio.")}</p>
                    ${id !== currentId ? `<button data-m="dmOpen" data-id="${esc(id)}" class="${BTN} mt-4">✉️ Envoyer un message privé</button>` : ""}
                </div>`);
        }

        window.openAdminPanel = () => { if (canMod()) { adminMembersOpen = false; adminManage = null; renderAdminPanel(true); } };

        function renderAdminPanel(open) {
            const rows = Object.entries(profiles).sort((a, b) => (a[1].pseudo || "").localeCompare(b[1].pseudo || "")).map(([id, p]) => `<div class="flex items-center gap-2 py-2 border-b border-slate-100">
                    <span class="text-xl">${esc(p.avatar || "🙂")}</span><b class="text-sm text-slate-800">${esc(p.pseudo || id)}</b><span class="text-xs text-slate-400">@${esc(id)}</span><span class="text-xs">${tagsOf(id, p)}</span>
                    ${(id !== ADMIN_ID && id !== currentId) ? `<button data-m="adminManage" data-id="${esc(id)}" class="ml-auto px-2 py-1 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200">⚙️ Gérer</button>` : ""}</div>`).join("");

            const roomRows = Object.entries(allRooms()).map(([id, r]) => `<div class="flex items-center gap-2 py-1.5 border-b border-slate-100 text-sm"><span class="flex-1 truncate">${r.private ? "🔒" : "#"} ${esc(r.name || id)} <span class="text-xs text-slate-400">${r.writers === "admin" ? "· admins" : r.writers === "mods" ? "· modos" : ""}</span></span><button data-m="roomEdit" data-id="${esc(id)}" class="px-2 py-1 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200">⚙️ Paramètres</button><button data-m="roomDel" data-id="${esc(id)}" class="px-2 py-1 rounded-lg text-xs font-semibold bg-red-100 hover:bg-red-200 text-red-700">🗑️</button></div>`).join("");
            const adminTools = isAdmin ? `
                <h4 class="${LBL}">💬 Salons</h4>${roomRows}<button data-m="roomNew" class="${BTN} mt-2">＋ Créer un salon</button>
                <h4 class="${LBL}">📢 Annonce épinglée</h4>
                <div class="flex gap-2"><input id="ad-ann" placeholder="Texte de l'annonce..." class="${INP}"><button data-m="adminAnnounce" class="${BTN}">Publier</button></div>` : "";

            const html = (adminManage && profiles[adminManage]) ? manageView(adminManage)
                : `${modalHead(isAdmin ? "👑 Panneau admin" : "🛡️ Modération")}${adminTools}<button data-m="adminToggleMembers" class="mt-5 w-full flex justify-between items-center text-xs font-bold uppercase tracking-wider text-slate-500"><span>👥 Membres (${Object.keys(profiles).length})</span><span>${adminMembersOpen ? "▲" : "▼"}</span></button>${adminMembersOpen ? rows : ""}`;
            if (open) openModal("admin", html); else if (modalKind === "admin") $("modal-body").innerHTML = html;
        }

        $("modal-body").addEventListener("click", async (e) => {
            const b = e.target.closest("[data-m]");
            if (!b) return;
            const d = b.dataset;
            try {
                switch (d.m) {
                    case "close": return closeModal();
                    case "avatar": draft.avatar = d.v; document.querySelectorAll('[data-m="avatar"]').forEach(x => x.classList.toggle("ring-2", x.dataset.v === d.v)); return;
                    case "saveProfile":
                        await update(R("profiles/" + currentId), { pseudo: $("pf-pseudo").value.trim(), bio: $("pf-bio").value.trim(), avatar: draft.avatar });
                        closeModal(); return toast("Profil mis à jour ✅");
                    case "pollSend":
                        await postMessage($("pl-q").value.trim(), "poll", { question: $("pl-q").value.trim(), options: $("pl-o").value.split("\n").map(x => x.trim()).filter(Boolean).slice(0, 6) });
                        closeModal(); return;
                    case "imgSend":
                        await postMessage($("im-cap").value.trim(), null, await pickAtt());
                        closeModal(); return;
                    case "hwSend":
                        const rub = $("hw-r").value;
                        const att = ($("im-file").files[0] || $("im-url").value.trim()) ? await pickAtt() : {};
                        await set(push(R("homework/" + rub)), { title: $("hw-t").value.trim(), text: $("hw-x").value.trim(), due: $("hw-d").value, image: att.image || "", ...(att.file ? { file: att.file } : {}), user: currentUser, userId: currentId, createdAt: Date.now() });
                        closeModal(); renderHomework(); return toast("Publié ✅");
                    case "roomNew": return openRoomEditor();
                    case "roomEdit": return openRoomEditor(d.id);
                    case "roomSave":
                        if (!isAdmin) return;
                        let id = $("rm-id").value;
                        const name = $("rm-name").value.trim();
                        if (!id) id = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-") + "-" + Math.random().toString(36).slice(2, 5);
                        await set(R("rooms/" + id), {
                            name, writers: $("rm-w").value, private: $("rm-priv").checked,
                            members: $("rm-mem").value.split(",").map(normId).filter(Boolean).join(","),
                            slow: Math.max(0, +$("rm-slow").value || 0), maxLen: Math.min(500, Math.max(20, +$("rm-max").value || 500)),
                            polls: $("rm-poll").checked, images: $("rm-img").checked, createdAt: (allRooms()[id] || {}).createdAt || Date.now()
                        });
                        closeModal(); return toast("Salon enregistré ✅");
                    case "roomDel":
                        if (!isAdmin) return;
                        if (!confirm("Supprimer ce salon ?")) return;
                        await remove(R("rooms/" + d.id)); await remove(R("channels/" + d.id));
                        return toast("🗑️ Salon supprimé.");
                    case "adminToggleMembers": adminMembersOpen = !adminMembersOpen; return renderAdminPanel();
                    case "adminManage": adminManage = d.id; return renderAdminPanel();
                    case "adminBack": adminManage = null; return renderAdminPanel();
                    case "viewProf": return viewProfile(d.id);
                    case "dmOpen": return openDm(d.id);
                    case "dmReply":
                        const q = inbox[d.key] || {};
                        const author = (profiles[q.from] || {}).pseudo || q.fromName || "Anonyme";
                        const txt = q.text || (q.file ? "📎 " + q.file.name : q.image ? "🖼️ Image" : "");
                        return openDm(d.id, { user: author, text: txt });
                    case "inboxDel": await remove(R(`inbox/${currentId}/${d.key}`)); return;
                    case "dmSend":
                        const to = $("dm-to").value, text = $("dm-t").value.trim();
                        const attDm = ($("im-file").files[0] || $("im-url").value.trim()) ? await pickAtt() : {};
                        const replyData = window._activeDmReply || null;
                        await set(push(R("inbox/" + to)), {
                            from: currentId,
                            fromName: currentUser,
                            text,
                            createdAt: Date.now(),
                            read: false,
                            ...(attDm.image ? { image: attDm.image } : {}),
                            ...(attDm.file ? { file: attDm.file } : {}),
                            ...(replyData ? { replyTo: replyData } : {})
                        });
                        window._activeDmReply = null;
                        closeModal(); return toast("✉️ Message envoyé.");
                    case "adminMute": return setFlag(d.id, "muted", !(profiles[d.id] || {}).muted);
                    case "adminBan": return setFlag(d.id, "banned", !(profiles[d.id] || {}).banned);
                    case "adminMod": return setRole(d.id, (profiles[d.id] || {}).role === "mod" ? "member" : "mod");
                    case "adminAnnounce": return setAnnouncement($("ad-ann").value.trim());
                }
            } catch (err) { toast("Erreur : " + err.message); }
        });
    </script>
</body>
</html>
