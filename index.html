<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Classe en Temps Réel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col">

    <!-- Écran de connexion (Pseudo) -->
    <div id="auth-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-96">
            <h2 class="text-2xl font-bold mb-4 text-slate-800">Bienvenue sur le Chat !</h2>
            <p class="text-sm text-slate-600 mb-4">Entre ton prénom ou ton pseudo :</p>
            <input type="text" id="username-input" placeholder="Ton pseudo..." class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Entrer dans le chat</button>
        </div>
    </div>

    <!-- Interface principale -->
    <div class="flex h-full overflow-hidden">

        <!-- Barre latérale : Salons -->
        <div class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-4 border-b border-slate-800">
                <h1 class="text-xl font-bold">📚 Chat de Classe</h1>
                <span id="current-user-display" class="text-xs text-slate-400"></span>
            </div>
            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="text-xs uppercase tracking-wider text-slate-400 mb-2">Salons</h2>
                <div class="space-y-1">
                    <button onclick="switchChannel('general')" class="w-full text-left px-3 py-2 rounded-lg bg-blue-600 text-white font-medium transition channel-btn" data-channel="general"># general</button>
                    <button onclick="switchChannel('devoirs')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 transition channel-btn" data-channel="devoirs"># devoirs</button>
                    <button onclick="switchChannel('memes')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 transition channel-btn" data-channel="memes"># loisirs-partage</button>
                </div>
            </div>
        </div>

        <!-- Zone de discussion -->
        <div class="flex-1 flex flex-col bg-white">
            <div class="p-4 border-b flex items-center justify-between bg-white shadow-sm">
                <h2 id="active-channel-title" class="text-lg font-bold text-slate-800"># general</h2>
            </div>

            <div id="messages-container" class="flex-1 p-4 overflow-y-auto space-y-4">
                <!-- Les messages s'affichent ici -->
            </div>

            <!-- Formulaire d'envoi -->
            <div class="p-4 border-t bg-white">
                <form id="message-form" onsubmit="sendMessage(event)" class="flex items-center gap-2">
                    <input type="text" id="message-input" placeholder="Écris ton message..." class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" autocomplete="off">
                    <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Envoyer</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Script Firebase (Realtime Database) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAI54Qv3XeLkwsJxHCICaLFrh9tuhPCPo",
            authDomain: "chat-classe-ddafc.firebaseapp.com",
            databaseURL: "https://chat-classe-ddafc-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chat-classe-ddafc",
            storageBucket: "chat-classe-ddafc.firebasestorage.app",
            messagingSenderId: "509741806327",
            appId: "1:509741806327:web:9afa9a30df2d81161759f2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = localStorage.getItem("chat_username") || "";
        let currentChannel = "general";

        window.onload = () => {
            if (currentUser) {
                document.getElementById("auth-modal").classList.add("hidden");
                document.getElementById("current-user-display").innerText = `Connecté : ${currentUser}`;
                loadMessages();
            }
        };

        window.login = () => {
            const input = document.getElementById("username-input").value.trim();
            if (input) {
                currentUser = input;
                localStorage.setItem("chat_username", currentUser);
                document.getElementById("auth-modal").classList.add("hidden");
                document.getElementById("current-user-display").innerText = `Connecté : ${currentUser}`;
                loadMessages();
            }
        };

        window.switchChannel = (channel) => {
            currentChannel = channel;
            document.getElementById("active-channel-title").innerText = `# ${channel}`;

            document.querySelectorAll('.channel-btn').forEach(btn => {
                if(btn.dataset.channel === channel) {
                    btn.className = "w-full text-left px-3 py-2 rounded-lg bg-blue-600 text-white font-medium transition channel-btn";
                } else {
                    btn.className = "w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-300 transition channel-btn";
                }
            });

            loadMessages();
        };

        function loadMessages() {
            const container = document.getElementById("messages-container");
            container.innerHTML = "";

            // Récupère les messages du salon dans Realtime Database
            const messagesRef = query(ref(db, 'channels/' + currentChannel), limitToLast(100));

            onValue(messagesRef, (snapshot) => {
                container.innerHTML = "";

                if (!snapshot.exists()) {
                    container.innerHTML = `<p class="text-center text-slate-400 text-sm my-4">Aucun message pour l'instant dans ce salon. Soyez le premier à écrire !</p>`;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const msg = childSnapshot.val();
                    const isMe = msg.user === currentUser;

                    const div = document.createElement("div");
                    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

                    div.innerHTML = `
                        <div class="text-xs text-slate-500 mb-1">${escapeHtml(msg.user || 'Anonyme')}</div>
                        <div class="max-w-md px-4 py-2 rounded-2xl ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-slate-200 text-slate-800 rounded-bl-none'}">
                            <p class="break-words">${escapeHtml(msg.text || '')}</p>
                        </div>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        window.sendMessage = async (e) => {
            e.preventDefault();
            const textInput = document.getElementById("message-input");
            const text = textInput.value.trim();

            if (!text) return;

            try {
                const messagesRef = ref(db, 'channels/' + currentChannel);
                const newMessageRef = push(messagesRef);
                await set(newMessageRef, {
                    text: text,
                    user: currentUser,
                    createdAt: Date.now()
                });
                textInput.value = "";
            } catch (err) {
                alert("Erreur lors de l'envoi du message : " + err.message);
            }
        };

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
